name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert the two requirements files stay in sync
        run: diff backend/requirements.txt backend/api/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest
      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Verify committed build is up to date
        working-directory: frontend
        run: |
          npm run build
          git diff --exit-code dist/ || (echo "dist/ is stale — run 'npm run build' and commit." && exit 1)
