<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BudgetMart | Real-time Grocery Price Comparison</title>
    <meta name="description"
        content="Compare grocery prices across Indian platforms by true price-per-unit, not just sticker price.">

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>

    <main class="container">
        <header class="header">
            <h1 class="logo">Budget<span>Mart</span></h1>
            <p class="subtitle">Compare grocery prices by true value — not just the sticker price.</p>
        </header>

        <section class="search-section">
            <form id="searchForm" class="search-box glass-panel" role="search">
                <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
                <label class="sr-only" for="searchInput">Product</label>
                <input type="text" id="searchInput"
                    placeholder="Search a product (e.g. 'Amul Milk', 'Bread', 'Eggs')..." autocomplete="off" required>

                <div class="location-divider" aria-hidden="true"></div>

                <i class="fa-solid fa-location-dot search-icon location-icon" aria-hidden="true"></i>
                <label class="sr-only" for="locationInput">Location</label>
                <input type="text" id="locationInput" class="location-input" placeholder="Zip / City"
                    autocomplete="off">

                <button type="submit" id="searchBtn" class="btn-search">Search</button>
            </form>

            <div class="filters">
                <label class="filter-label" for="sortSelect">Sort by:</label>
                <select id="sortSelect" class="glass-dropdown">
                    <option value="value_asc">Best value (price / unit)</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="availability">Availability First</option>
                </select>
            </div>
        </section>

        <section class="results-container">
            <!-- Demo-mode banner -->
            <div id="demoBanner" class="demo-banner hidden" role="status"></div>

            <!-- Results summary -->
            <p id="resultsSummary" class="results-summary hidden" aria-live="polite"></p>

            <!-- Loading -->
            <div id="loader" class="loader hidden" role="status" aria-live="polite">
                <div class="spinner" aria-hidden="true"></div>
                <p>Scouring the web for the best price...</p>
            </div>

            <!-- Neutral empty state -->
            <div id="emptyMessage" class="empty-msg hidden" role="status">
                <i class="fa-solid fa-box-open" aria-hidden="true"></i>
                <span id="emptyText">No products found.</span>
            </div>

            <!-- Error state -->
            <div id="errorMessage" class="error-msg hidden" role="alert">
                <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                <span id="errorText">Something went wrong.</span>
            </div>

            <!-- Results grid -->
            <div id="resultsGrid" class="results-grid"></div>
        </section>
    </main>

    <script src="dist/main.js" defer></script>
</body>

</html>
